<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html

    # Render (and any Docker host) injects config as OS environment variables.
    # Apache/mod_php only exposes env vars to PHP that are explicitly passed
    # through, so without this PHP's getenv('SMTP_USER') etc. return nothing.
    PassEnv APP_ENV RENDER
    PassEnv SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY
    PassEnv SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS MAIL_FROM MAIL_FROM_NAME
    PassEnv RESEND_API_KEY

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
