services:
  - type: web
    name: sunder-solar-mis
    runtime: docker
    plan: free
    healthCheckPath: /auth/login.php
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Sunder Solar MIS
      # Render blocks outbound SMTP (ports 25/465/587) on free web services,
      # so SMTP_* above will time out there. Fix: send over HTTPS instead.
      # sendAppEmail() picks a transport automatically, first match wins:
      #   BREVO_API_KEY set  -> Brevo (no domain needed, sends to anyone —
      #                         use this one for password-reset emails)
      #   RESEND_API_KEY set -> Resend (no setup needed, but without a
      #                         verified domain can only deliver to the
      #                         Resend account's own address)
      #   neither set        -> falls back to SMTP_* above
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
