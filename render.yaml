services:
  - type: web
    name: sunder-solar-mis
    runtime: docker
    plan: free
    healthCheckPath: /auth/login.php
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
