services:
  - type: web
    name: sunder-solar-mis
    runtime: docker
    plan: free
    healthCheckPath: /auth/login.php
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Sunder Solar MIS
      # Optional: set RESEND_API_KEY to send over HTTPS via resend.com instead
      # of SMTP. Render blocks outbound SMTP (ports 25/465/587) on free web
      # services, so SMTP_* above will time out there — Resend is the fix.
      # When RESEND_API_KEY is set it takes priority automatically; no other
      # change needed. Get a free key at resend.com (no card required).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
