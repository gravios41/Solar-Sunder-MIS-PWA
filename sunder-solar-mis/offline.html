<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F97316">
    <title>Offline - Sunder Solar MIS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #F1F5F9;
            color: #0F172A;
        }
        main {
            width: min(100%, 440px);
            padding: 28px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            line-height: 1.2;
        }
        p {
            margin: 0 0 20px;
            color: #475569;
            line-height: 1.6;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            background: #F97316;
            color: #FFFFFF;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="./assets/images/icons/icon-192.png" alt="Sunder Solar">
        <h1>You are offline</h1>
        <p>Sunder Solar MIS needs a connection for live records. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </main>
</body>
</html>
